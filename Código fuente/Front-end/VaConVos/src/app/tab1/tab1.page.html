<ion-content [fullscreen]="true">
<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>VaConVos</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2 class="title">Productos destacados</h2>

  <ion-list>
    <ion-item button detail="true">
      <ion-icon slot="start" name="basket-outline" class="icon-large"></ion-icon>
      <ion-label>Frutas y verduras</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon slot="start" name="restaurant-outline" class="icon-large"></ion-icon>
      <ion-label>Carnes</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon slot="start" name="storefront-outline" class="icon-large"></ion-icon>
      <ion-label>Supermercado</ion-label>
    </ion-item>
  </ion-list>

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="cart">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Carrito</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="history">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>

</ion-content>
