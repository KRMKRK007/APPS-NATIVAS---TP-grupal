<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Perfil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>VaConVos</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="profile-container">
    <ion-avatar class="avatar">
      <ion-icon name="person-circle-outline"></ion-icon>
    </ion-avatar>
    <h2>Perfil</h2>
  </div>

  <ion-list>
    <ion-item button detail="true">
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>Dirección</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-label> datos </ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon slot="start" name="card-outline"></ion-icon>
      <ion-label>Medios de pago</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon slot="start" name="call-outline"></ion-icon>
      <ion-label>Contacto</ion-label>
    </ion-item>

     <ion-item button detail="true">
      <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
      <ion-label>Atención al cliente</ion-label>
    </ion-item>
  </ion-list>

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="cart">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Carrito</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="history">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>

</ion-content>
