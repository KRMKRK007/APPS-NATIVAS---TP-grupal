<ion-content [fullscreen]="true">
  <ion-header>
    <ion-toolbar color="light">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/"></ion-back-button>
      </ion-buttons>
      <ion-title>VaConVos</ion-title>
      <ion-buttons slot="end">
        <ion-button>
          <ion-icon name="notifications-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <div class="profile-container ion-padding">
    <ion-avatar class="avatar">
      <ion-icon name="person-circle-outline"></ion-icon>
    </ion-avatar>
    <h2>Perfil y dirección</h2>
  </div>

  <ion-list>
    <ion-item button detail="true" (click)="goToAddresses()">
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>Mis direcciones</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goToEditProfile()">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-label>Editar perfil</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goToPaymentMethods()">
      <ion-icon slot="start" name="card-outline"></ion-icon>
      <ion-label>Métodos de pago</ion-label>
    </ion-item>
  </ion-list>

  <ion-list>
    <ion-item button detail="true" (click)="openContact()">
      <ion-icon slot="start" name="call-outline"></ion-icon>
      <ion-label>Contacto</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="openSupport()">
      <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
      <ion-label>Atención al cliente</ion-label>
    </ion-item>

    <ion-item button detail="true" color="danger" (click)="signOut()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
