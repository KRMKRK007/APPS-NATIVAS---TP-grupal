<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Historial de Pedidos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list *ngIf="!loading && !error && orders.length">
    <ion-item *ngFor="let order of orders">
      <ion-thumbnail slot="start">
        <img src="assets/icon/supermercado-icon.png" alt="Pedido" />
      </ion-thumbnail>
      <ion-label>
        <h2>Pedido #{{ order.id }}</h2>
        <p>Fecha: {{ order.fecha | date:'short' }}</p>
        <p>Productos: {{ itemsCount(order) }}</p>
        <p><strong>Total: ${{ order.total }}</strong></p>
        <p>Método: {{ order.payment_method }}</p>
      </ion-label>
      <ion-badge color="success" slot="end">Registrado</ion-badge>
    </ion-item>
  </ion-list>

  <div class="ion-padding" *ngIf="loading">Cargando...</div>
  <div class="ion-padding" *ngIf="!loading && error">{{ error }}</div>
  <div class="ion-padding" *ngIf="!loading && !error && !orders.length">No hay pedidos aún.</div>
</ion-content>
