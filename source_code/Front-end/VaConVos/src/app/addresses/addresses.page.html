<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/tabs/tab4"></ion-back-button></ion-buttons>
    <ion-title>Mis direcciones</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item><ion-label position="stacked">Dirección</ion-label><ion-input [(ngModel)]="line1"></ion-input></ion-item>
    <ion-item><ion-label position="stacked">Ciudad</ion-label><ion-input [(ngModel)]="city"></ion-input></ion-item>
  </ion-list>
  <ion-button expand="block" (click)="add()">Agregar</ion-button>

  <ion-list *ngIf="addresses.length">
    <ion-item *ngFor="let a of addresses">
      <ion-label>{{ a.line1 }} <small *ngIf="a.city">- {{ a.city }}</small></ion-label>
      <ion-button slot="end" color="danger" (click)="remove(a.id)">Eliminar</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
