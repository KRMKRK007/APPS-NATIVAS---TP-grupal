<ion-header>
  <ion-toolbar color="light">
    <ion-title>VaConVos</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2 class="title">Categorías</h2>

  <ion-list>
    <ion-item button detail="true" (click)="verProductos('Frutas y Verduras')">
      <ion-icon slot="start" name="basket-outline" class="icon-large"></ion-icon>
      <ion-label>Frutas y verduras</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="verProductos('Carnes')">
      <ion-icon slot="start" name="restaurant-outline" class="icon-large"></ion-icon>
      <ion-label>Carnes</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="verProductos('Almacen')">
      <ion-icon slot="start" name="storefront-outline" class="icon-large"></ion-icon>
      <ion-label>Almacén</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="verProductos('Bebidas')">
      <ion-icon slot="start" name="wine-outline" class="icon-large"></ion-icon>
      <ion-label>Bebidas</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
