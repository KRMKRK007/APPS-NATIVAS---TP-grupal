<ion-header>
  <ion-toolbar color="light">
    <ion-title>VaConVos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar productos..."
                 (ionInput)="onSearchInput($event)"></ion-searchbar>

  <h2 class="title">Categorías</h2>
  <ion-list>
    <ion-item button detail="true" (click)="verProductos('Frutas y Verduras')">
      <ion-label>Frutas y Verduras</ion-label>
    </ion-item>
    <ion-item button detail="true" (click)="verProductos('Carnes')">
      <ion-label>Carnes</ion-label>
    </ion-item>
    <ion-item button detail="true" (click)="verProductos('Almacen')">
      <ion-label>Almacén</ion-label>
    </ion-item>
    <ion-item button detail="true" (click)="verProductos('Bebidas')">
      <ion-label>Bebidas</ion-label>
    </ion-item>
  </ion-list>

  <h2 class="title">Productos</h2>
  <ion-list>
    <ion-item *ngFor="let p of products">
      <ion-label>
        <h2>{{ p.nombre }}</h2>
        <p>{{ p.descripcion }}</p>
        <p><strong>${{ p.precio }}</strong></p>
      </ion-label>
      <ion-button slot="end" color="primary" (click)="agregarAlCarrito(p)">
        Agregar
      </ion-button>
    </ion-item>
    <div class="ion-text-center ion-padding" *ngIf="products.length === 0">
      No hay resultados.
    </div>
  </ion-list>
</ion-content>
